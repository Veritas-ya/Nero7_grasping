name: Logic regression tests
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-logic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src/nero7_control:src/nero7_perception
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install test dependencies
        run: python -m pip install numpy scipy opencv-python-headless pyyaml pytest
      - name: Compile all project Python sources
        run: python -m compileall -q src
      - name: Run hardware independent regressions
        run: >-
          python -m pytest -q
          tests/test_controller_boundaries.py
          src/nero7_control/test/test_fsm_regressions.py
          src/nero7_control/test/test_plan_validity.py
          src/nero7_control/test/test_conveyor_prediction.py
          src/nero7_control/test/test_kalman_control.py
          src/nero7_perception/test/test_tracking_regressions.py
          src/nero7_perception/test/test_kalman_motion.py
          src/nero7_perception/test/test_visual_speed.py
          src/nero7_perception/test/test_depth_center.py
          src/nero7_perception/test/test_debug_overlay_regressions.py
      - name: Compare synthetic plane-fitting performance
        run: python scripts/benchmark_perception.py
